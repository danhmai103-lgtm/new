function addEg(){evG(I()).push({txt:'',imgs:[]});evGo()}

function togShare(){shareOpen=!shareOpen;const y=scrollY;go('dash');scrollTo(0,y)}

const H=t=>{let h=5381;for(let k=0;k<t.length;k++)h=(h*33^t.charCodeAt(k))>>>0;return h.toString(36)+t.length.toString(36)};
async function putBlob(u){const k='b'+H(u),d=DB.doc('blobs/'+k);if(bc[k])return k;const g=await d.get();if(!g.exists){const n=Math.ceil(u.length/200000);for(let c=0;c<n;c++)await DB.doc('blobs/'+k+'/c/'+c).set({s:u.slice(c*200000,(c+1)*200000)});await d.set({n})}bc[k]=u;return k}
async function getBlob(k){if(bc[k])return bc[k];const g=await DB.doc('blobs/'+k).get();if(!g.exists)return'';let t='';for(let c=0;c<g.data().n;c++)t+=(await DB.doc('blobs/'+k+'/c/'+c).get()).data().s;return bc[k]=t}
async function pack(o){let t=JSON.stringify(o);for(const u of new Set([...t.matchAll(/"(data:[^"]{200,})"/g)].map(x=>x[1]))){const k=await putBlob(u);t=t.split('"'+u+'"').join('"ref:'+k+'"')}return JSON.parse(t)}
async function unpack(o){let t=JSON.stringify(o);for(const k of new Set([...t.matchAll(/"ref:(b[a-z0-9]+)"/g)].map(x=>x[1]))){t=t.split('"ref:'+k+'"').join(JSON.stringify(await getBlob(k)))}return JSON.parse(t)}
async function push(i){const b={i,c:S.cases[i.id]||null},h=H(JSON.stringify(b));if(synced[i.id]==h)return;const d=await pack(b),upd=Date.now();d.upd=upd;await DB.doc('issues/'+i.id).set(d);synced[i.id]=h;S.meta[i.id]=upd}

async function initDb(){try{DB=await claude.use('db');if(!DB)return;S.meta=S.meta||{};try{const u=await claude.use('user');if(u&&(await u.can('data.write'))===false)canW=false}catch(e){}

DB.collection('issues').onSnapshot(async snap=>{let ch=0;try{if(!ready&&!snap.empty){const ids=new Set(snap.docs.map(d=>d.id));const n=S.issues.length;S.issues=S.issues.filter(i=>ids.has(i.id)||S.meta[i.id]!==undefined);if(S.issues.length!=n)ch=1}
for(const c of snap.docChanges()){const id=c.doc.id;if(c.type=='removed'){if(S.issues.some(x=>x.id==id)){S.issues=S.issues.filter(x=>x.id!=id);delete S.cases[id];delete synced[id];ch=1}continue}
const d=c.doc.data();if(!d||(S.meta[id]||0)>=d.upd)continue;const u=await unpack({i:d.i,c:d.c}),k=S.issues.findIndex(x=>x.id==id);k<0?S.issues.push(u.i):S.issues[k]=u.i;if(u.c)S.cases[id]=u.c;S.meta[id]=d.upd;synced[id]=H(JSON.stringify({i:u.i,c:u.c||null}));ch=1}}catch(e){}
if(ch){S.issues.sort((a,b)=>b.id.localeCompare(a.id));if(!S.issues.find(i=>i.id==S.cur))S.cur=(S.issues[0]||{}).id||'';localStorage.setItem('qp2',JSON.stringify(S));rr()}
ready=1;syncSoon()},()=>{syncMsg='Đồng bộ chưa khả dụng (cần đăng nhập claude.ai)'})}catch(e){}}
